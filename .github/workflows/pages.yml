name: Deploy Ginhawa PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate static site entry
        run: |
          test -s public/index.html
          test -s public/booking.html
          test -s public/js/google-maps-config.js
          test -s public/js/location.js
      - name: Validate frontend JavaScript and assets
        run: |
          node --check public/js/app.js
          node --check public/js/location.js
          node --check public/js/google-maps-config.js
          node --check public/js/runtime-config.js
          node --check scripts/build-client-config.mjs
          node --check functions/index.js
          node --test functions/matching.test.js
          node --input-type=module --check < public/js/firebase.js
          python3 - <<'PY'
          import struct, pathlib, json, zlib
          root=pathlib.Path('public')
          manifest=json.loads((root/'manifest.webmanifest').read_text())
          assert (root/manifest['start_url']).is_file()
          for icon in manifest['icons']:
              data=(root/icon['src']).read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II',data[16:24])
              assert f'{w}x{h}'==icon['sizes']
              offset=8
              compressed=bytearray()
              while offset<len(data):
                  length=struct.unpack('>I',data[offset:offset+4])[0]
                  typ=data[offset+4:offset+8]
                  payload=data[offset+8:offset+8+length]
                  stored=struct.unpack('>I',data[offset+8+length:offset+12+length])[0]
                  assert zlib.crc32(typ+payload)&0xffffffff==stored
                  if typ==b'IDAT':compressed.extend(payload)
                  offset+=12+length
              # PNG color types include palette-indexed (3), not only RGBA (6).
              channels={0:1,2:3,3:1,4:2,6:4}.get(data[25])
              assert channels is not None, f"Invalid PNG color type for {icon['src']}"
              assert data[28]==0, f"Unsupported interlaced PNG icon: {icon['src']}"
              row_bytes=(w*channels*data[24]+7)//8
              expected=h*(1+row_bytes)
              actual=len(zlib.decompress(compressed))
              assert actual==expected, f"Invalid PNG pixel payload for {icon['src']}: {actual} != {expected}"
          for path in root.glob('*.html'):
              assert '<html' in path.read_text().lower()
          assert 'maps.googleapis.com/maps/api/js' in (root/'js/location.js').read_text()
          print('Ginhawa PWA static checks passed')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
